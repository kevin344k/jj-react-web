    - generic [ref=f13e28]:
      - paragraph [ref=f13e29]: Contenido del libro
      - heading "¿Qué encontrarás en el libro?" [level=2] [ref=f13e30]
      - paragraph [ref=f13e31]: Muchos intentan entender Bitcoin sin antes comprender el dinero. Por eso, este libro comienza explorando el origen del dinero, su evolución y el sistema financiero actual. Con esa base, entender Bitcoin, su propósito y su papel en la inversión y la seguridad será mucho más sencillo.
      - generic [ref=f13e32]:
        - article [ref=f13e33]:
          - generic [ref=f13e34]: "01"
          - heading "El origen del dinero" [level=3] [ref=f13e35]
          - paragraph [ref=f13e36]: El libro comienza explorando la relación entre el ser humano, la pobreza y el dinero, para posteriormente analizar qué es el dinero y cuáles son sus propiedades.
        - article [ref=f13e37]:
          - generic [ref=f13e38]: "02"
          - heading "La historia de las monedas" [level=3] [ref=f13e39]
          - paragraph [ref=f13e40]: "Recorre distintos momentos de la historia monetaria: Roma, los templarios, el florín, el real portugués, el real español, la bolsa de Amberes, la libra francesa y la libra esterlina, mostrando la evolución de las monedas y los sistemas monetarios."
        - article [ref=f13e41]:
          - generic [ref=f13e42]: "03"
          - heading "Oro, inflación y dinero fiat" [level=3] [ref=f13e43]
          - paragraph [ref=f13e44]: Analiza acontecimientos como la Primera Guerra Mundial, la inflación, la Reserva Federal, Bretton Woods, el final del patrón oro, la decisión de Nixon en 1971 y la expansión del dinero fiat, conectando estos hechos con la crítica del autor al sistema monetario actual.
        - article [ref=f13e45]:
          - generic [ref=f13e46]: "04"
          - heading "Bitcoin" [level=3] [ref=f13e47]
          - paragraph [ref=f13e48]: Presenta qué es Bitcoin, su escasez, su descentralización, su funcionamiento basado en reglas matemáticas, una comparación con el oro y la idea de propiedad y soberanía sobre los propios fondos.
        - article [ref=f13e49]:
          - generic [ref=f13e50]: "05"
          - heading "Inversión y estrategia" [level=3] [ref=f13e51]
          - paragraph [ref=f13e52]: El libro aborda la inversión en Bitcoin, la acumulación, la preparación, la disciplina, la lectura, la creación de ingresos y una comparación entre Bitcoin y bienes raíces, dentro de una estrategia a largo plazo. Este contenido refleja el análisis del autor y no constituye asesoría financiera personalizada.
        - article [ref=f13e53]:
          - generic [ref=f13e54]: "06"
          - heading "Seguridad y estafas" [level=3] [ref=f13e55]
          - paragraph [ref=f13e56]: "Uno de los bloques más prácticos: llaves privadas, custodia, wallets, exchanges, cómo reconocer estafas, promesas de rentabilidades imposibles y ejemplos de esquemas relacionados con criptomonedas. No basta con conocer Bitcoin: también hay que saber protegerlo y reconocer posibles fraudes."
